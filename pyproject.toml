[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "app"
version = "0.1.0"
description = "FastAPI scaffolding app with a health check endpoint."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
# Tests live in tests/; _backup/ and ix-forge/ are explicitly excluded from
# test scans (see conventions.md). Constraining testpaths keeps the canonical
# `pytest` invocation deterministic and avoids module-name collisions with the
# duplicated modules under _backup/.
testpaths = ["tests"]
norecursedirs = ["_backup", "ix-forge", ".git", "*.egg", "build", "dist"]
