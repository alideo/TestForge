[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "app"
version = "0.1.0"
description = "FastAPI scaffolding app with a health check endpoint."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
# Only the delivered test package is scanned. _backup/ (a development-time copy)
# and ix-forge/ (platform files) are off-limits per CLAUDE.md/KB and share module
# basenames with tests/, which would otherwise break collection.
testpaths = ["tests"]
norecursedirs = ["_backup", "ix-forge", ".git", "__pycache__", ".pytest_cache", ".venv"]
